name: Fix homepage info card links
on:
  push:
    branches: [repair/home-info-card-links-20260830]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/home-info-card-links-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_home_info_card_links.py
      - name: Commit homepage card-link repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Link homepage planning cards to tools"
          git push
