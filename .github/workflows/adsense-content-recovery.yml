name: MyCalendarTools AdSense Content Recovery

on:
  push:
    branches:
      - repair/adsense-content-recovery-20260824
    paths:
      - scripts/repair_adsense_content.py
      - .github/workflows/adsense-content-recovery.yml

permissions:
  contents: write

jobs:
  recover-content:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/adsense-content-recovery-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair page-specific content
        run: python scripts/repair_adsense_content.py
      - name: Sanity checks
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = [
            'is commonly used for:',
            'astronomical or tidal calculations',
            'School holiday dates for New 2025',
            'Countdown to Mother It runs',
            'Countdown to Father It runs',
            'Live countdown to St Patrick It runs',
          ]
          hits=[]
          for p in Path('.').rglob('index.html'):
              t=p.read_text(encoding='utf-8', errors='ignore')
              for s in bad:
                  if s in t: hits.append((str(p),s))
          if hits:
              for h in hits: print('BAD', *h)
              raise SystemExit(1)
          print('Content sanity checks passed')
          PY
      - name: Commit repaired pages to repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/index.html' '*/*/index.html'
          if git diff --cached --quiet; then
            echo "No page changes to commit"
          else
            git commit -m "Repair page-specific AdSense content without touching production"
            git push origin HEAD:repair/adsense-content-recovery-20260824
          fi
