name: MyCalendarTools AdSense Content Recovery

on:
  push:
    branches:
      - repair/adsense-content-recovery-20260824
    paths:
      - scripts/repair_adsense_content.py
      - scripts/repair_remaining_content.py
      - scripts/repair_country_pages.py
      - scripts/remove_generic_boost_blocks.py
      - scripts/fix_country_hero_markup.py
      - .github/workflows/adsense-content-recovery.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/repair_adsense_content.py
      - scripts/repair_remaining_content.py
      - scripts/repair_country_pages.py
      - scripts/remove_generic_boost_blocks.py
      - scripts/fix_country_hero_markup.py
      - .github/workflows/adsense-content-recovery.yml
      - '**/index.html'

permissions:
  contents: write

jobs:
  recover-content:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/adsense-content-recovery-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair page-specific content
        shell: bash
        run: |
          set +e
          python scripts/repair_adsense_content.py
          code=$?
          echo "primary_repair_exit=$code"
          python scripts/repair_remaining_content.py
          python scripts/repair_country_pages.py
          python scripts/fix_country_hero_markup.py
          python scripts/remove_generic_boost_blocks.py
      - name: Verify content and HTML integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = [
            'is commonly used for:',
            'astronomical or tidal calculations',
            'School holiday dates for New 2025',
            'School term dates for New 2025',
            'School holiday and public holiday dates for New.',
            'School term start and end dates for New.',
            'Countdown to Mother It runs',
            'Countdown to Father It runs',
            'Live countdown to St Patrick It runs',
            'NOAA tide times for US coastal stations',
            'Common examples include checking a deadline before booking travel',
          ]
          hits=[]
          controls=[]
          for p in Path('.').rglob('*.html'):
              t=p.read_text(encoding='utf-8', errors='strict')
              for s in bad:
                  if s in t: hits.append((str(p),s))
              bad_ctrl = sorted({ord(c) for c in t if ord(c) < 32 and c not in '\n\r\t'})
              if bad_ctrl:
                  controls.append((str(p), bad_ctrl))
          if hits or controls:
              for h in hits: print('REMAINING', *h)
              for p,codes in controls: print('CONTROL_CHARACTER', p, codes)
              raise SystemExit(1)
          print('Content signatures clean and HTML contains no forbidden control characters')
          PY
      - name: Commit repaired pages to repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/index.html' '*/*/index.html' 'about/index.html'
          if git diff --cached --quiet; then
            echo "No page changes to commit"
          else
            git commit -m "Complete MyCalendarTools AdSense content recovery"
            git push origin HEAD:repair/adsense-content-recovery-20260824
          fi
# draft PR recovery gate v5
