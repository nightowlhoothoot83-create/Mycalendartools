name: Final AdSense visual/mobile polish
on:
  push:
    branches:
      - repair/final-adsense-visual-mobile-20260830
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/final_adsense_polish.py
      - name: Commit generated repairs
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply final AdSense visual/mobile shell repairs"
          git push
