name: Content regression guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject stale, generic or malformed content regressions
        run: python scripts/validate-content-regression.py
