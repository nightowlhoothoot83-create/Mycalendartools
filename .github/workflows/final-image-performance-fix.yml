name: Final Calendar image optimizer

on:
  push:
    branches: [adsense/final-readiness-20260829]
    paths:
      - .github/workflows/final-image-performance-fix.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adsense/final-readiness-20260829
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Create display-sized WebP assets and patch shared components
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image

          root=Path('.')
          out=root/'assets'/'perf'
          out.mkdir(parents=True,exist_ok=True)
          specs={
            'wheelnamepicker-logo.png':180,
            'adg-downloads.png':180,
            'ascension-digital.jpg':720,
            'spew-crew.png':180,
            'mystical-moments.png':180,
            'zyia-creations.png':180,
            'mycalctools-logo.png':180,
            'raven-sharp.jpg':180,
            'feed-the-feed.jpg':180,
            'mycalendartools-logo.jpg':180,
            'ventraip-affiliate-banner.jpg':1200,
          }
          created={}
          for name,max_dim in specs.items():
            src=root/name
            if not src.exists(): continue
            with Image.open(src) as im:
              im=im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
              if max(im.size)>max_dim:
                scale=max_dim/max(im.size)
                im=im.resize((max(1,round(im.width*scale)),max(1,round(im.height*scale))),Image.Resampling.LANCZOS)
              dst=out/(src.stem+'.webp')
              im.save(dst,'WEBP',quality=88,method=6)
              created[name]='/'+dst.as_posix()

          p=root/'components.js'
          text=p.read_text(encoding='utf-8')
          for old,new in created.items():
            text=text.replace('/'+old,new)
          p.write_text(text,encoding='utf-8')

      - name: Commit optimized Calendar assets
        run: |
          git config user.name "adg-final-readiness"
          git config user.email "actions@users.noreply.github.com"
          git add assets/perf components.js
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Optimize Calendar ecosystem image delivery"
            git push origin HEAD:adsense/final-readiness-20260829
          fi
