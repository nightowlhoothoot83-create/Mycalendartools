name: Indexing integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-indexing-integrity.mjs
      - name: Check sourced school calendars and browser-region behaviour
        run: |
          node scripts/build-school-calendar.mjs --check
          node scripts/school-calendar-regression.mjs

