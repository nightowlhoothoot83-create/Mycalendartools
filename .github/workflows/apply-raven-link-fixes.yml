name: Apply Raven Sharp link fixes

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-raven-link-fixes.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix canonical Raven Sharp destinations
        run: |
          python - <<'PY'
          from pathlib import Path
          changes = {
            'components.js': [
              ('https://pod.raven-sharp.com/login', 'https://raven-sharp.com'),
            ],
            'index.html': [
              ('https://raven-sharp-image-optimiser.pages.dev', 'https://opt.raven-sharp.com/optimiser'),
            ],
          }
          for name, replacements in changes.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in replacements:
                  s = s.replace(old, new)
              if s == original:
                  print(f'No changes needed in {name}')
              else:
                  p.write_text(s, encoding='utf-8')
                  print(f'Updated {name}')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: route Raven Sharp links to canonical live destinations"
          git push
