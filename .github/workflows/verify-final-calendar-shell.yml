name: Verify final Calendar shell

on:
  push:
    branches:
      - audit/final-3site-check-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify every Calendar HTML page
        run: python scripts/verify_final_calendar_shell.py
